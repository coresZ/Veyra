name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "platforms;android-37" > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "build-tools;37.0.0" > /dev/null 2>&1 || true

      - name: Set up Kotlin compiler
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip
          unzip -q /tmp/kotlin.zip -d /opt/kotlin/
          echo "KOTLIN_HOME=/opt/kotlin/kotlinc" >> $GITHUB_ENV

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.Veyra_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/veyra-release.keystore

      - name: Build release APK
        env:
          CHENGZI_KEYSTORE: ${{ runner.temp }}/veyra-release.keystore
          CHENGZI_STORE_PASS: ${{ secrets.Veyra_STORE_PASS }}
          CHENGZI_KEY_PASS: ${{ secrets.Veyra_KEY_PASS }}
          CHENGZI_KEY_ALIAS: ${{ secrets.Veyra_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          ls -la app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for $TAG"
          # 删除已存在的 release（tag push 会自动创建空 release）
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          # 创建新 release 并上传 APK
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Veyra $TAG" \
            --notes "$TAG: Go签名器直连取流，1080p全清晰度" \
            --latest
