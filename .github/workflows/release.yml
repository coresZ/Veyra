name: Release (APK + Docker Image)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (preinstalled)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "platforms;android-37" > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "platforms;android-37.0" > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "build-tools;37.0.0" > /dev/null 2>&1 || true
          ls $SDK/platforms $SDK/build-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Kotlin compiler
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip
          unzip -q /tmp/kotlin.zip -d /opt/kotlin/
          echo "KOTLIN_HOME=/opt/kotlin/kotlinc" >> $GITHUB_ENV

      - name: Compute version
        run: |
          VER=$(grep "versionName" app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
          echo "VER=$VER" >> $GITHUB_ENV
          echo "Veyra version: $VER"

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.Veyra_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/veyra-release.keystore
          ls -la $RUNNER_TEMP/veyra-release.keystore

      - name: Build release APK
        env:
          CHENGZI_KEYSTORE: ${{ runner.temp }}/veyra-release.keystore
          CHENGZI_STORE_PASS: ${{ secrets.Veyra_STORE_PASS }}
          CHENGZI_KEY_PASS: ${{ secrets.Veyra_KEY_PASS }}
          CHENGZI_KEY_ALIAS: ${{ secrets.Veyra_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature & version
        run: |
          ls -la app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/*/aapt2 dump badging app/build/outputs/apk/release/app-release.apk | grep versionName || true

      - name: Save Docker image tar
        continue-on-error: true
        run: |
          docker build -t gybeyond/veyra-backend:$VER server
          docker tag gybeyond/veyra-backend:$VER gybeyond/veyra-backend:latest
          docker save -o veyra-backend.tar gybeyond/veyra-backend:latest
          ls -la veyra-backend.tar

      - name: Push image to Docker Hub (if credentials configured)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push gybeyond/veyra-backend:$VER
          docker push gybeyond/veyra-backend:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Veyra-$VER-release.apk
          ASSETS="Veyra-$VER-release.apk"
          if [ -f veyra-backend.tar ]; then ASSETS="$ASSETS veyra-backend.tar"; fi
          gh release create v$VER $ASSETS \
            --title "Veyra $VER" \
            --notes "v$VER: Go签名器直连取流，1080p全清晰度，不再依赖被风控的中转API" || \
            gh release upload v$VER $ASSETS --clobber
