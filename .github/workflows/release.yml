name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '可选：release tag 名（留空则按运行时间自动生成，如 v20261021-1430）'
        required: false
        type: string
      release_notes:
        description: '可选：本次 release 介绍（留空则自动根据 commit 生成 changelog）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply DownloadManager concat-engine patch
        run: |
          if git apply --check --reverse patches/downloadmanager-concat-engine.patch 2>/dev/null; then
            echo "concat-engine 补丁已包含在源码中，跳过"
          else
            git apply patches/downloadmanager-concat-engine.patch
            echo "concat-engine 补丁已应用"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "platforms;android-37" > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "build-tools;37.0.0" > /dev/null 2>&1 || true

      - name: Set up Kotlin compiler
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip
          unzip -q /tmp/kotlin.zip -d /opt/kotlin/
          echo "KOTLIN_HOME=/opt/kotlin/kotlinc" >> $GITHUB_ENV

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.Veyra_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/veyra-release.keystore

      - name: Build release APK
        env:
          CHENGZI_KEYSTORE: ${{ runner.temp }}/veyra-release.keystore
          CHENGZI_STORE_PASS: ${{ secrets.Veyra_STORE_PASS }}
          CHENGZI_KEY_PASS: ${{ secrets.Veyra_KEY_PASS }}
          CHENGZI_KEY_ALIAS: ${{ secrets.Veyra_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(date +%Y%m%d-%H%M)"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          # APK 改名：Veyra-<tag>.apk（CI 正式签名 keystore 构建）
          cp app/build/outputs/apk/release/app-release.apk Veyra-$TAG.apk
          # 后端最新镜像同步进 release（gzip 压缩，NAS 可 docker load 离线部署）
          docker pull gybeyond/veyra-backend:latest
          docker save gybeyond/veyra-backend:latest | gzip -9 > veyra-backend-latest.tar.gz
          ls -la Veyra-$TAG.apk veyra-backend-latest.tar.gz
          sha256sum Veyra-$TAG.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$TAG"
          echo "Creating release for $TAG"
          # 删除已存在的 release（tag push 会自动创建空 release）
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "$NOTES" ]; then
            echo "使用自定义 release notes"
            gh release create "$TAG" \
              "Veyra-$TAG.apk" \
              veyra-backend-latest.tar.gz \
              --title "Veyra $TAG" \
              --notes "$NOTES" \
              --latest
          else
            echo "自动生成 changelog"
            gh release create "$TAG" \
              "Veyra-$TAG.apk" \
              veyra-backend-latest.tar.gz \
              --title "Veyra $TAG" \
              --generate-notes \
              --latest
          fi
