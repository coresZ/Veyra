<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veyra</title>
<script src="/hls.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#1a1e26;--line:#2a3040;--fg:#e8ecf3;--mut:#8a93a5;--ok:#37d67a;--err:#ff5c5c;--acc:#f5d782;--acc2:#6c8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.header{position:sticky;top:0;z-index:100;background:rgba(15,17,21,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:1px;color:var(--acc);white-space:nowrap}
.search{flex:1;min-width:180px;max-width:480px;background:#0d0f13;border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--fg);font-size:14px;outline:none}
.search:focus{border-color:var(--acc2)}
.mode-toggle{display:flex;background:#0d0f13;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mode-toggle button{background:transparent;border:none;color:var(--mut);padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.mode-toggle button.active{background:var(--acc);color:#1a1e26}
.gear{background:transparent;border:1px solid var(--line);color:var(--mut);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.gear:hover{border-color:var(--mut);color:var(--fg)}
.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 20px;max-width:1200px;margin:0 auto;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;background:#0d0f13;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 16px;cursor:pointer;font-size:13px;white-space:nowrap;transition:.2s}
.cat-btn:hover{border-color:var(--mut);color:var(--fg)}
.cat-btn.active{background:var(--acc);color:#1a1e26;font-weight:700;border-color:var(--acc)}
.container{max-width:1200px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.card-poster{cursor:pointer;transition:transform .2s}
.card-poster:hover{transform:translateY(-4px)}
.poster-img{width:100%;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--card);border:1px solid var(--line)}
.poster-title{font-size:13px;margin-top:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster-badge{font-size:11px;color:var(--mut);margin-top:2px}
.loading{text-align:center;padding:60px;color:var(--mut)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;padding:24px;margin:auto}
.modal-close{float:right;background:transparent;border:none;color:var(--mut);font-size:22px;cursor:pointer}
.modal-actions{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-main{background:var(--acc);color:#1a1e26;border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer}
.btn-main:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer}
.btn-ghost:hover{border-color:var(--mut)}
.ep-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;margin-top:16px}
.ep-toolbar{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.ep-toolbar .chk-all{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.ep-toolbar .chk-all input{width:auto}
.ep-toolbar .ep-count{font-size:12px;color:var(--mut)}
.ep-item{position:relative;display:flex;align-items:center;justify-content:center}
.ep-item .ep-check{position:absolute;left:-2px;top:-2px;width:auto;accent-color:var(--acc);z-index:2}
.ep-btn{background:#0d0f13;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 0;text-align:center;cursor:pointer;font-size:13px;width:100%}
.ep-btn:hover{border-color:var(--acc2)}
.ep-btn.playing{background:var(--acc);color:#1a1e26;font-weight:700}
.ep-item.off .ep-btn{opacity:.45}
.player-wrap{margin-top:16px;display:none}
.player-wrap.open{display:block}
video{width:100%;border-radius:10px;background:#000}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:290;display:none}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;right:-440px;width:420px;max-width:95vw;height:100vh;background:var(--card);border-left:1px solid var(--line);z-index:300;transition:right .3s;overflow-y:auto;padding:24px}
.drawer.open{right:0}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer h2{font-size:15px;color:var(--acc);margin:20px 0 10px}
.drawer h2:first-child{margin-top:0}
.drawer input{width:100%;background:#0d0f13;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:8px}
.drawer button{background:var(--acc);color:#1a1e26;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-right:6px}
.drawer button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.drawer button.danger{background:var(--err);color:#fff}
.drawer .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.drawer .k{color:var(--mut);font-size:12px}
.drawer table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.drawer td,.drawer th{border:1px solid var(--line);padding:5px 7px;text-align:left}
.drawer th{color:var(--mut)}
.otp-big{font-size:28px;letter-spacing:4px;font-weight:700;color:var(--acc)}
.radio-group{display:flex;gap:8px;margin:6px 0 12px}
.radio-group label{background:#0d0f13;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--mut)}
.radio-group label.active{background:var(--acc);color:#1a1e26;font-weight:700;border-color:var(--acc)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 20px;border-radius:10px;font-size:13px;z-index:400;display:none}
.modal-wide{position:relative;width:min(560px,92vw);max-height:82vh;display:flex;flex-direction:column}
.modal-wide .modal-close{position:absolute;top:14px;right:14px}
.dlmgr-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 0}
.dlmgr-item{background:#0d0f13;border:1px solid var(--line);border-radius:10px;padding:12px}
.dlmgr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.dlmgr-title{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlmgr-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#1a1e26;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.dlmgr-badge.ok{color:#3ddc97;border-color:#3ddc9755}
.dlmgr-badge.err{color:#ff6b6b;border-color:#ff6b6b55}
.dlmgr-badge.run{color:#f6c343;border-color:#f6c34355}
.dlmgr-bar{height:6px;border-radius:3px;background:#1a1e26;overflow:hidden;margin:6px 0}
.dlmgr-bar>i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.dlmgr-detail{font-size:12px;color:var(--mut);margin-bottom:8px;word-break:break-all}
.dlmgr-ops{display:flex;gap:8px;flex-wrap:wrap}
.dlmgr-ops .ghost{font-size:12px;padding:6px 12px;margin:0}
.dlmgr-empty{color:var(--mut);font-size:13px;text-align:center;padding:30px 0}
.dlmgr-output{font-size:11px;color:var(--acc);word-break:break-all;margin-top:6px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">Veyra</div>
  <input class="search" id="search-input" placeholder="搜索短剧…">
  <div class="mode-toggle">
    <button id="mode-public" class="active">公开</button>
    <button id="mode-private">私密</button>
  </div>
  <button class="gear" id="btn-downloads" title="NAS 下载管理">⬇</button>
  <button class="gear" id="btn-settings">⚙</button>
</div>
<div class="cat-bar" id="cat-bar" style="display:none"></div>
<div class="container">
  <div class="grid" id="grid"><div class="loading">加载中…</div></div>
</div>

<div class="modal-overlay" id="detail-overlay">
  <div class="modal">
    <button class="modal-close" id="btn-close-detail">✕</button>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <img id="d-poster" class="poster-img" style="width:140px;flex-shrink:0" src="">
      <div style="flex:1;min-width:200px">
        <h2 id="d-title" style="margin-bottom:8px"></h2>
        <p id="d-desc" style="color:var(--mut);font-size:13px"></p>
        <p id="d-badge" style="color:var(--mut);font-size:12px;margin-top:6px"></p>
        <div class="modal-actions">
          <button class="btn-main" id="btn-play">▶ 播放</button>
          <button class="btn-main" id="btn-download">⬇ 下载到NAS</button>
          <span id="dl-status" style="font-size:12px;color:var(--mut)"></span>
        </div>
      </div>
    </div>
    <div class="player-wrap" id="player-wrap">
      <video id="player" controls autoplay></video>
    </div>
    <div class="ep-list" id="ep-list"></div>
  </div>
</div>

<div class="modal-overlay" id="download-overlay">
  <div class="modal">
    <button class="modal-close" id="btn-close-dl">✕</button>
    <h3 id="dl-title" style="margin-bottom:4px"></h3>
    <p id="dl-hint" style="font-size:12px;color:var(--mut);margin-bottom:12px">勾选要下载的集数，默认全选</p>
    <div class="ep-toolbar" id="dl-toolbar" style="display:none">
      <label class="chk-all"><input type="checkbox" id="dl-chk-all" checked> 全选</label>
      <span id="dl-selected" class="ep-count"></span>
    </div>
    <div class="ep-list" id="dl-ep-list"></div>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-main" id="btn-dl-confirm">开始下载（N集）</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dlmgr-overlay">
  <div class="modal modal-wide">
    <button class="modal-close" id="btn-close-dlmgr">✕</button>
    <h3 style="margin-bottom:12px">NAS 下载管理</h3>
    <div class="dlmgr-list" id="dlmgr-list"><div class="loading">加载中…</div></div>
  </div>
</div>

<div class="drawer-mask" id="drawer-mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 style="margin:0">管理</h2>
    <button class="ghost" id="btn-close-drawer" style="margin:0;width:32px;height:32px;padding:0;font-size:16px;border-radius:8px">✕</button>
  </div>
  <div id="login-area">
    <input type="password" id="admin-pass" placeholder="管理员密码">
    <button id="btn-admin-login">登录</button>
    <span id="login-err" style="color:var(--err);font-size:12px"></span>
  </div>
  <div id="admin-area" style="display:none">
    <div class="row"><span class="k">用户</span><b id="s-users">-</b><span class="k">注册</span><b id="s-reg">-</b></div>
    <h2>注册开关</h2>
    <div class="row"><label style="font-size:13px"><input type="checkbox" id="reg-open" style="width:auto"> 开放注册</label><button id="btn-save-reg">保存</button></div>
    <h2>后端代理</h2>
    <input id="backend-proxy" placeholder="http://ip:port 或 socks5://ip:port">
    <div class="row"><button id="btn-save-proxy">保存</button><button class="ghost" id="btn-test-proxy">测试</button></div>
    <p id="proxy-status" style="font-size:12px;color:var(--mut)"></p>
    <h2>私密播放通道</h2>
    <p style="font-size:12px;color:var(--mut)">私密模式（黄果）播放/封面走哪种方式，立即生效</p>
    <div class="radio-group">
      <label id="ch-relay" data-ch="relay">后端转发</label>
      <label id="ch-direct" data-ch="direct">直连</label>
    </div>
    <h2>动态码</h2>
    <div class="row"><span class="otp-big" id="otp-code">------</span><span class="k" id="otp-remain"></span></div>
    <button class="ghost" id="btn-reset-otp">重置动态码</button>
    <h2>用户管理</h2>
    <table><thead><tr><th>用户</th><th>角色</th><th>操作</th></tr></thead><tbody id="user-rows"></tbody></table>
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="btn-admin-diagnose">私密源诊断</button>
      <button class="ghost" id="btn-admin-logout">退出登录</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="diag-overlay">
  <div class="modal modal-wide">
    <button class="modal-close" id="btn-close-diag">✕</button>
    <h3 style="margin-bottom:12px">私密源诊断</h3>
    <div id="diag-body" style="font-size:12px;line-height:1.8;color:var(--mut);white-space:pre-wrap;word-break:break-all;overflow-y:auto;max-height:62vh"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="login-gate" style="position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="font-size:28px;font-weight:800;color:var(--acc)">Veyra</div>
  <input type="password" id="gate-pass" placeholder="管理员密码" style="width:280px;background:#0d0f13;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px 16px;font-size:15px;outline:center">
  <button id="gate-btn" style="background:var(--acc);color:#1a1e26;border:none;border-radius:10px;padding:12px 40px;font-size:15px;font-weight:700;cursor:pointer">进入</button>
  <div id="gate-err" style="color:var(--err);font-size:13px"></div>
</div>

<script>
let mode='public', adminToken=localStorage.getItem('veyraAdmin')||'';
const AUTH=()=>({Authorization:'Bearer '+adminToken});
const grid=document.getElementById('grid');
const HUANGGUO_BASE='https://www.pqhybuxo.cc/';
let _items=[], _detail=null; // _detail={id,title,seriesId,eps:[{number}],vids:[]}

async function gateLogin(){
  const p=document.getElementById('gate-pass').value;
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){document.getElementById('gate-err').textContent=d.error||'密码错误';return}
    adminToken=d.token;localStorage.setItem('veyraAdmin',adminToken);
    document.getElementById('login-gate').style.display='none';
    loadHome();
  }catch(e){document.getElementById('gate-err').textContent='网络错误'}
}
document.getElementById('gate-btn').onclick=gateLogin;
document.getElementById('gate-pass').addEventListener('keydown',e=>{if(e.key==='Enter')gateLogin()});

(async()=>{
  if(!adminToken){document.getElementById('gate-pass').focus();return}
  try{
    const r=await fetch('/api/admin/session',{headers:AUTH()});
    if(r.ok){document.getElementById('login-gate').style.display='none';loadHome();return}
  }catch(e){}
  adminToken='';localStorage.removeItem('veyraAdmin');
  document.getElementById('gate-pass').focus();
})();

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}

document.getElementById('mode-public').onclick=()=>setMode('public');
document.getElementById('mode-private').onclick=()=>setMode('private');
document.getElementById('search-input').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});

// ---- 抽屉：打开/关闭 + 遮罩收回 ----
const drawer=document.getElementById('drawer');
const drawerMask=document.getElementById('drawer-mask');
function openDrawer(){
  drawer.classList.add('open');drawerMask.classList.add('open');
  document.getElementById('login-area').style.display='none';
  document.getElementById('admin-area').style.display='block';
  loadAdmin();loadChannelUi();
}
function closeDrawer(){drawer.classList.remove('open');drawerMask.classList.remove('open')}
document.getElementById('btn-settings').onclick=()=>drawer.classList.contains('open')?closeDrawer():openDrawer();
document.getElementById('btn-close-drawer').onclick=closeDrawer;
drawerMask.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

document.getElementById('btn-close-detail').onclick=closeDetail;
document.getElementById('detail-overlay').addEventListener('click',e=>{if(e.target.id==='detail-overlay')closeDetail()});

function setMode(m){
  mode=m;
  document.getElementById('mode-public').classList.toggle('active',m==='public');
  document.getElementById('mode-private').classList.toggle('active',m==='private');
  document.getElementById('cat-bar').style.display=m==='public'?'flex':'none';
  loadHome();
}

// ---- 私密播放通道（localStorage 持久化） ----
const channelKey='veyraPrivateChannel';
let privateChannel=localStorage.getItem(channelKey)||'relay';
function loadChannelUi(){
  document.getElementById('ch-relay').classList.toggle('active',privateChannel==='relay');
  document.getElementById('ch-direct').classList.toggle('active',privateChannel==='direct');
}
document.querySelectorAll('#drawer [data-ch]').forEach(l=>l.onclick=()=>{
  privateChannel=l.dataset.ch;localStorage.setItem(channelKey,privateChannel);loadChannelUi();toast('私密通道：'+(privateChannel==='relay'?'后端转发':'直连'));
});
function proxyUrl(u){
  if(privateChannel==='relay')return hgProxy(u);
  // 直连模式：https 页面加载 http 资源会被浏览器拦（混合内容），统一升 https 尝试
  return u.replace(/^http:\/\//i,'https://');
}
// 私密源代理 URL：与 APK 后端转发完全一致（/api/huangguo-proxy?url=<raw>，无 ref）。
// 后端对上游的 Referer 自动取 https://<当前请求host>/，与 APK 播放器行为相同（APK 实测可播）。
function hgProxy(u){
  return '/api/huangguo-proxy?url='+encodeURIComponent(u);
}

async function loadHome(){
  grid.innerHTML='<div class="loading">加载中…</div>';
  try{
    if(mode==='public'){
      const r=await fetch('/api/web/hongguo/home').then(x=>x.json());
      renderGrid(r.items||[]);
      loadCategories();
    }else{
      const r=await fetch(hgProxy(HUANGGUO_BASE));
      if(!r.ok)throw new Error('黄果源 '+r.status+'：请在管理抽屉配置可用的 backendProxy 后端代理');
      const html=await r.text();
      const items=parseHuangguoHtml(html);
      if(!items.length)grid.innerHTML='<div class="loading">私密源解析为空：可能页面结构变化或需配置后端代理</div>';
      else renderGrid(items);
    }
  }catch(e){grid.innerHTML='<div class="loading">加载失败: '+e.message+'</div>'}
}

// ---- 分类条（公开模式） ----
async function loadCategories(){
  const bar=document.getElementById('cat-bar');
  try{
    const d=await fetch('/api/web/hongguo/category?tab=1').then(x=>x.json());
    const tabs=d.tabs||[];
    if(!tabs.length){bar.style.display='none';return}
    bar.innerHTML=[{tab:'1',name:'推荐'}].concat(tabs).map((t,i)=>
      '<button class="cat-btn'+(i===0?' active':'')+'" data-tab="'+t.tab+'">'+escapeHtml(t.name||('分类'+t.tab))+'</button>').join('');
    bar.querySelectorAll('.cat-btn').forEach(b=>b.onclick=()=>{
      bar.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      loadCategory(b.dataset.tab);
    });
    bar.style.display='flex';
  }catch(e){bar.style.display='none'}
}
async function loadCategory(tab){
  grid.innerHTML='<div class="loading">加载中…</div>';
  try{
    const d=await fetch('/api/web/hongguo/category?tab='+encodeURIComponent(tab)).then(x=>x.json());
    renderGrid(d.items||[]);
  }catch(e){grid.innerHTML='<div class="loading">加载失败: '+e.message+'</div>'}
}

function parseHuangguoHtml(html){
  const items=[], seen=new Set();
  const base=HUANGGUO_BASE;
  // 收集所有 a 链接：href 或 onclick 里带播放/详情关键字
  const links=[];
  const reA=/<a[^>]*>[\s\S]*?<\/a>|<a[^>]*\/\s*>/gi;
  let am;
  while((am=reA.exec(html))!==null&&links.length<300){
    links.push(am[0]);
  }
  const pushItem=(href,cover,title)=>{
    if(!href)return;
    let u=href;try{u=new URL(href,base).toString()}catch{return}
    if(!/detail|video|play|show|vod|info|series|drama/i.test(u))return;
    // 私密站三子域（thu/www/m）指向同一内容：seen 去重前归一化为 www
    let uKey=u;try{const x=new URL(u);if(x.hostname.endsWith('.pqhybuxo.cc'))x.hostname='www.pqhybuxo.cc';uKey=x.toString()}catch{}
    if(seen.has(uKey))return;seen.add(uKey);
    let c=cover||'';try{if(c)c=new URL(c,base).toString()}catch{}
    items.push({id:u,title:(title||'').trim(),cover:c,coverFrom:String(cover||'').slice(0,140),badge:'',detailUrl:u});
  };
  // 封面提取多策略：img 各种懒加载属性 → srcset → style 背景图 → video poster
  function coverOf(seg){
    if(!seg)return '';
    const attr=/<(?:img|source)[^>]+(?:data-src|data-original|data-lazy|data-lazy-src|data-cover|data-thumb|data-poster|data-bg|data-background|data-img|src)="([^"]+)"/i;
    const m=seg.match(attr); if(m&&m[1]&&!m[1].startsWith('data:'))return m[1];
    const m2=seg.match(/<img[^>]+srcset="([^"]+)"/i);
    if(m2){const c=(m2[1].split(',')[0]||'').trim().split(/\s+/)[0]||''; if(c&&!c.startsWith('data:'))return c;}
    const m3=seg.match(/(?:style|css)="[^"]*(?:background|background-image)\s*:\s*url\(\s*['"]?([^'")]+)['"]?\s*\)/i);
    if(m3&&m3[1])return m3[1].trim();
    const m4=seg.match(/<video[^>]+poster="([^"]+)"/i); if(m4&&m4[1])return m4[1];
    return '';
  }
  for(const seg of links){
    const href=(seg.match(/href="([^"]+)"/)||[])[1]||'';
    if(!href)continue;
    const cover=coverOf(seg);
    // 标题：优先源站卡片标题 class（.hg-drama-card__title，APK 选择器同款）→ 标签文本 → aria/title 属性 → href slug
    let title=(seg.match(/class="[^"]*hg-drama-card__title[^"]*"[^>]*>([\s\S]*?)<\//i)||[])[1]||'';
    title=title.replace(/<[^>]+>/g,'').trim();
    if(!title)title=(seg.match(/<(?:h\d|p|span|div|b|strong|i|em)[^>]*>([\s\S]*?)<\/(?:h\d|p|span|div|b|strong|i|em)>/i)||[])[1]||'';
    title=title.replace(/<[^>]+>/g,'').trim();
    if(!title)title=(seg.match(/\s(?:title|aria-label)="([^"]+)"/i)||[])[1]||'';
    if(!title){
      // href slug 兜底：/video/123/abc-name/ → abc name
      try{
        const ps=new URL(href,base).pathname.split('/').filter(Boolean);
        const last=ps[ps.length-1]||'';
        if(!/^\d+$/.test(last)&&last!=='video')title=last.replace(/[-_]+/g,' ');
      }catch{}
    }
    pushItem(href,cover,title);
  }
  // 兜底 1：裸链接 + 相邻 img（含 style 背景）
  if(!items.length){
    const re=/<a[^>]+href="([^"]+)"[^>]*>[\s\S]{0,400}?(?:<img[^>]+(?:data-src|data-original|data-lazy|data-lazy-src|data-cover|data-thumb|data-poster|src)="([^"]+)"|style="[^"]*(?:background|background-image)\s*:\s*url\(\s*['"]?([^'")]+))/i;
    let m;
    while((m=re.exec(html))!==null&&items.length<30){
      let href=m[1],cover=m[2]||m[3]||'';
      try{href=new URL(href,base).toString()}catch{continue}
      if(!/detail|video|play|show|vod|info|series|drama/i.test(href)||seen.has(href))continue;
      seen.add(href);
      try{cover=new URL(cover,base).toString()}catch{}
      items.push({id:href,title:'',cover,coverFrom:String(cover||'').slice(0,140),badge:'',detailUrl:href});
    }
  }
  // 兜底 2：条目已有但封面为空时，用整页图片按顺序配对（封面特征词优先）
  if(items.length){
    const imgs=[]; re=/<img[^>]+(?:data-src|data-original|data-lazy|data-lazy-src|data-cover|data-thumb|data-poster|src)="([^"]+)"/gi;
    while((m=re.exec(html))!==null&&imgs.length<300){const v=m[1]; if(v&&!v.startsWith('data:'))imgs.push(v);}
    const bg=[]; re=/url\(\s*['"]?([^'")]+\.(?:jpe?g|png|webp|gif|avif)(?:\?[^'")]*)?)['"]?\s*\)/gi;
    while((m=re.exec(html))!==null&&bg.length<100){const v=m[1]; if(v&&/^https?:/i.test(v)&&!/(logo|icon|avatar|banner)/i.test(v))bg.push(v);}
    const pool=bg.concat(imgs).filter(u=>/^(https?:|data:)/i.test(u));
    let pi=0;
    for(const it of items){
      if(it.cover||pi>=pool.length)continue;
      // 优先找含封面特征词的 URL
      let hit=null;
      for(let k=pi;k<pool.length;k++){
        if(/(cover|poster|thumb|upload|pic|img|face|bg|vod|movie)/i.test(pool[k])){hit=pool[k];pi=k+1;break;}
      }
      if(!hit){hit=pool[pi];pi++;}
      try{it.cover=new URL(hit,base).toString()}catch{}
      if(pi>=pool.length)break;
    }
  }
  // 最终防线：同剧不同 URL 形式（/video/10058/ vs /drama/10058/ 等）按任意数字 id 合并，保留首个
  const dedup=[],idSeen=new Set();
  for(const it of items){
    const segs=it.id.split('/').filter(Boolean);
    const num=segs.find(s=>/^\d+$/.test(s))||'';
    if(num&&idSeen.has(num))continue;
    if(num)idSeen.add(num);
    dedup.push(it);
  }
  return dedup;
}

function escapeHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function coverSrc(cover){
  if(!cover)return '';
  if(/^https?:\/\//i.test(cover))return cover;
  return '/api/huangguo-proxy?url='+encodeURIComponent(cover);
}
// 封面加载兜底：后端代理转发失败时降级直连原始 URL，仍失败则灰底占位
function fallbackCover(img){
  const cur=img.getAttribute('src')||'';
  if(cur.indexOf('/api/huangguo-proxy?')===0){
    const m=cur.match(/[?&]url=([^&]+)/);
    if(m){img.onerror=null;img.src=decodeURIComponent(m[1]);return}
  }
  img.style.background='#1a1e26';
}
function renderGrid(items){
  _items=items||[];
  if(!_items.length){grid.innerHTML='<div class="loading">暂无内容</div>';return}
  grid.innerHTML=_items.map((it,i)=>{

    return '<div class="card-poster" data-i="'+i+'">'+
      '<img class="poster-img" src="'+src+'" loading="lazy" onerror="fallbackCover(this)"'+(src?'':' style="background:#1a1e26"')+'>'+
      '<div class="poster-title">'+escapeHtml(it.title)+'</div>'+
      (it.badge?'<div class="poster-badge">'+escapeHtml(it.badge)+'</div>':'')+'</div>';
  }).join('');
  grid.querySelectorAll('.card-poster').forEach(el=>el.onclick=()=>openDetail(+el.dataset.i));
}

function loadPublicDetail(it,tries){
  fetch('/api/web/hongguo/detail?id='+encodeURIComponent(it.id)).then(x=>{

  }).then(d=>{
    const rawEps=(d.raw&&(d.raw.detail_page&&d.raw.detail_page.episode_list))||(d.raw&&d.raw.episode_list)||[];
    let eps;

    else eps=(d.vids||[]).map((v,j)=>({number:j+1,vid:String(v)}));

      '<br><button class="ghost" style="margin-top:8px" onclick="loadPublicDetail(currentItem,'+tries+')">重试</button></div>';
  });
}

// ---- 播放进度记忆（localStorage，按剧集保存"看到第几集几分几秒"）----
const PROG_KEY='veyra_progress';
let _playingEp=-1; // 当前播放的集下标（0 起）
function getProgress(seriesId){
  try{return JSON.parse(localStorage.getItem(PROG_KEY)||'{}')[seriesId]||null}catch{return null}
}
function saveProgress(){
  if(!_detail||!_detail.seriesId||_playingEp<0)return;
  const player=document.getElementById('player');
  const sec=player.currentTime||0;
  if(sec<=0)return;
  const data=JSON.parse(localStorage.getItem(PROG_KEY)||'{}');
  data[_detail.seriesId]={ep:_playingEp+1,sec,ts:Date.now()};
  localStorage.setItem(PROG_KEY,JSON.stringify(data));
}
function updatePlayButton(){
  const btn=document.getElementById('btn-play');
  if(!_detail)return;
  const p=getProgress(_detail.seriesId);
  btn.textContent=p&&p.ep>0&&p.ep<=(_detail.eps||[]).length
    ? ('▶ 继续播放 第'+p.ep+'集 '+fmtTime(p.sec))
    : '▶ 播放';
}
function fmtTime(s){
  s=Math.floor(s||0);const m=Math.floor(s/60),ss=s%60;
  return m+':'+(ss<10?'0':'')+ss;
}

// ---- 播放按钮：有历史进度则从上次位置续播，否则从第 1 集开始 ----
document.getElementById('btn-play').onclick=()=>{
  if(!_detail)return;
  const eps=_detail.eps||[];
  if(!eps.length){toast('选集未就绪');return}

  else playEpisode(0);
};

// hls.js 播放器统一入口：m3u8 走 Hls（Chrome 原生不支持），mp4 直放
let _hls=null;
function attachPlayer(url,onReady){
  const player=document.getElementById('player');
  const wasPlaying=player.getAttribute('data-src')===url;
  if(wasPlaying&&player.readyState>=1){if(onReady)onReady();player.play().catch(()=>{});return}
  if(_hls){_hls.destroy();_hls=null}
  player.removeAttribute('src');player.load();
  player.onloadedmetadata=()=>{if(onReady)onReady()};
  player.onerror=()=>{toast('播放失败（错误码 '+(player.error?player.error.code:'?')+'），可在 ⚙ 里切换 直连/后端转发 通道再试');};
  if(/\.m3u8(\?|$)/i.test(url)&&window.Hls&&Hls.isSupported()){
    _hls=new Hls({maxBufferLength:30});
    _hls.loadSource(url);
    _hls.attachMedia(player);
    _hls.on(Hls.Events.ERROR,(e,data)=>{
      if(data&&data.fatal){
        const details=data.details||'';
        const net=data.networkDetails&&(data.networkDetails.message||data.networkDetails.statusText)?String(data.networkDetails.message||data.networkDetails.statusText):'';
        const resp=data.response&&data.response.code?('HTTP '+data.response.code):'';
        const frag=data.frag&&data.frag.url?(data.frag.url.slice(0,120)):'';
        toast('播放失败['+details+'] '+resp+' '+net+' '+(frag||''));
      }
    });
    player.play().catch(()=>{});
  }else{
    player.src=url;
    player.play().catch(()=>{});
  }
  player.setAttribute('data-src',url);
}

// 播放进度节流保存：每 5 秒 + 暂停/结束各存一次
let _lastSave=0;
const _playerEl=document.getElementById('player');
_playerEl.addEventListener('timeupdate',()=>{
  const now=Date.now();
  if(now-_lastSave<5000)return;
  _lastSave=now;saveProgress();
});
_playerEl.addEventListener('pause',saveProgress);
_playerEl.addEventListener('ended',()=>{saveProgress();updatePlayButton();});

function playEpisode(j,resumeSec){
  const ep=(_detail.eps||[])[j];if(!ep)return;
  const player=document.getElementById('player');
  document.getElementById('player-wrap').classList.add('open');
  document.getElementById('ep-list').querySelectorAll('.ep-btn').forEach(b=>b.classList.remove('playing'));
  const btns=document.getElementById('ep-list').querySelectorAll('.ep-btn');
  if(btns[j])btns[j].classList.add('playing');
  _playingEp=j;
  const doResume=()=>{
    if(resumeSec>0&&player.readyState>=1){
      try{player.currentTime=resumeSec}catch(e){}
    }
  };
  if(mode==='public'){
    if(!ep.vid){document.getElementById('player-wrap').classList.remove('open');toast('该集暂无可播放地址（vid 缺失）');return}
    attachPlayer('/api/web/hongguo/stream?vid='+encodeURIComponent(ep.vid),doResume);
  }else{
    if(ep.playUrl){attachPlayer(ep.playUrl,doResume);return}
    const u=ep.detailUrl||_detail.id;
    fetch(hgProxy(u)).then(r=>r.text()).then(html=>extractVideoSrcAsync(html,u)).then(src=>{
      if(!src){toast('未解析到播放地址（'+u.slice(0,60)+'），可尝试在 ⚙ 里切换 直连/后端转发 通道');return}
      _lastPrivatePlayUrl=src;
      const playUrl=proxyUrl(src);
      ep.playUrl=playUrl;
      attachPlayer(playUrl,doResume);
    }).catch(e=>toast('播放页获取失败: '+e.message));
  }
}

function extractVideoSrc(html,base){
  // 1) videoInitialData JSON 里的 videoSrc
  const vm=html.match(/<script[^>]*id="videoInitialData"[^>]*>([\s\S]*?)<\/script>/);
  if(vm){
    try{const d=JSON.parse(vm[1]);if(d.videoSrc)return new URL(d.videoSrc,base).toString()}catch{}
  }
  // 2) <video>/<source> src
  const vs=html.match(/<video[^>]*>[\s\S]*?<source[^>]+src="([^"]+)"[\s\S]*?<\/video>|<video[^>]+src="([^"]+)"/);
  if(vs){const u=vs[1]||vs[2];if(u)try{return new URL(u,base).toString()}catch{return u}}
  // 3) iframe 播放器：src 本身就是视频直链
  const im=html.match(/<iframe[^>]+src=["']([^"']+)["']/i);
  if(im){
    try{const fu=new URL(im[1],base).toString();if(/\.(m3u8|mp4)(\?|$)/i.test(fu))return fu}catch{}
  }
  // 4) script/页面里的 m3u8 或 mp4 直链
  const ms=html.match(/https?[^"'\s<>]+\.(m3u8|mp4)(\?[^"'\s<>]*)?/g);
  if(ms&&ms.length)return ms[0];
  return '';
}

// 异步取流：直接源失败时，iframe 播放页再抓一层（深度 1）
async function extractVideoSrcAsync(html,base){
  const direct=extractVideoSrc(html,base);
  if(direct)return direct;
  const im=html.match(/<iframe[^>]+src=["']([^"']+)["']/i);
  if(im){
    try{
      const frameUrl=new URL(im[1],base).toString();
      if(/\.(m3u8|mp4)(\?|$)/i.test(frameUrl))return frameUrl;
      const r=await fetch(hgProxy(frameUrl));
      if(!r.ok)return '';
      const fhtml=await r.text();
      const s=extractVideoSrc(fhtml,frameUrl);
      if(s)return s;
    }catch{}
  }
  return '';
}

function loadHuangguoDetail(it){
  fetch(hgProxy(it.detailUrl||it.id)).then(r=>{
    if(!r.ok)throw new Error('详情页 '+r.status+'（检查后端代理 backendProxy 是否配置且可访问黄果源）');
    return r.text();
  }).then(html=>{
    const eps=parseHuangguoEpisodes(html, it.detailUrl||it.id);
    if(!eps.length){
      // 单集站兜底：详情页直接内嵌播放器
      const src=extractVideoSrc(html, it.detailUrl||it.id);
      if(src)eps.push({number:1,detailUrl:it.detailUrl||it.id,vid:'',playUrl:''});
    }
    _detail.eps=eps.sort((a,b)=>a.number-b.number);
    renderEpisodes();
    if(!eps.length)document.getElementById('ep-list').innerHTML='<div class="loading">未能解析出选集（页面结构可能变化）</div>';
  }).catch(e=>{document.getElementById('ep-list').innerHTML='<div class="loading">详情获取失败: '+e.message+'</div>'});
}

// 私密源选集解析：只认"选集容器"里的集号链接，排除页面推荐位/导航，避免串剧
function parseHuangguoEpisodes(html, base){
  const eps=[], seen=new Set();
  const boxRe=/<(?:div|ul)[^>]*(?:class|id)=["'][^"']*(?:play|list|episode|juji|drama|series|bf|tab)[^"']*["'][^>]*>([\s\S]*?)<\/(?:div|ul)>/gi;
  const containers=[];let cm;
  while((cm=boxRe.exec(html))!==null&&containers.length<30){containers.push(cm[1])}
  // 找不到容器则整页作为候选段（仍走严格过滤）
  const segs=containers.length?containers:[html];
  for(const seg of segs){
    const re=/<a[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi;
    let m;
    while((m=re.exec(seg))!==null&&eps.length<300){
      const href=m[1].trim();
      const txt=(m[2]||'').replace(/<[^>]+>/g,'').trim();
      const n=parseInt(txt.replace(/[^\d]/g,''),10);
      if(!n||n<1||n>999||seen.has(n))continue;
      // 播放特征过滤：href 须为播放/详情路径或含数字路径；推荐位链接（纯文字/图片链接）排除
      if(!/(?:play|video|vod|show|detail|watch|ep|ju|info|drama)/i.test(href)&&!/\/\d+(-\d+)?(\.html?)?(\?|$)/.test(href))continue;
      let u;
      try{u=new URL(href,base).toString()}catch{continue}
      seen.add(n);
      eps.push({number:n,detailUrl:u,vid:'',playUrl:''});
    }
    if(eps.length>=2)break; // 首个有效容器解析到选集即停止
  }
  // 按钮 onclick 形式（play(123) / data-id）
  if(eps.length<2){
    const re2=/<button[^>]+onclick=["']([^"']+)["'][^>]*>\s*([0-9]{1,3})\s*<\/button>/gi;
    let m;
    while((m=re2.exec(html))!==null&&eps.length<300){
      const n=parseInt(m[2],10);
      if(!n||seen.has(n))continue;
      const idm=(m[1]||'').match(/[0-9]{6,}/);
      if(!idm)continue;
      seen.add(n);
      eps.push({number:n,detailUrl:base+'/'+idm[0],vid:'',playUrl:''});
    }
  }
  return eps;
}

  _detail=null;_playingEp=-1;
}

function openDownloadLayer(eps){

  const bar=document.getElementById('dl-toolbar');
  _dlSelected=new Set(eps.map(e=>e.number));
  list.innerHTML=eps.map((ep,j)=>
    '<label class="ep-item" data-j="'+j+'">'+
    '<input type="checkbox" class="dl-check" data-j="'+j+'" checked>'+
    '<span class="ep-btn" style="display:flex;align-items:center;justify-content:center">'+ep.number+'</span></label>').join('');
  const all=document.getElementById('dl-chk-all');
  all.checked=true;all.onchange=()=>{
    const on=all.checked;
    list.querySelectorAll('.dl-check').forEach(c=>{c.checked=on;c.closest('.ep-item').classList.toggle('off',!on);});
    _dlSelected.clear();eps.forEach((e)=>{if(on)_dlSelected.add(e.number);});
    updateDlCount(eps);
  };
  list.querySelectorAll('.dl-check').forEach(c=>c.onchange=()=>{
    const n=eps[+c.dataset.j].number;
    if(c.checked)_dlSelected.add(n);else _dlSelected.delete(n);
    c.closest('.ep-item').classList.toggle('off',!c.checked);
    const on=eps.every(e=>_dlSelected.has(e.number));
    document.getElementById('dl-chk-all').checked=on&&eps.length>0;
    updateDlCount(eps);
  });
  bar.style.display='flex';
  updateDlCount(eps);
  document.getElementById('download-overlay').classList.add('open');
}
function updateDlCount(eps){
  document.getElementById('dl-selected').textContent='已选 '+_dlSelected.size+' / '+eps.length+' 集';
  document.getElementById('btn-dl-confirm').textContent='开始下载（'+_dlSelected.size+'集）';
}
function closeDownloadLayer(){document.getElementById('download-overlay').classList.remove('open')}
document.getElementById('btn-close-dl').onclick=closeDownloadLayer;
document.getElementById('download-overlay').addEventListener('click',e=>{if(e.target.id==='download-overlay')closeDownloadLayer()});

document.getElementById('btn-dl-confirm').onclick=async()=>{

  const btn=document.getElementById('btn-dl-confirm');
  const episodes=[..._dlSelected].filter(n=>n>0).sort((a,b)=>a-b);

  btn.disabled=true;btn.textContent='提交中…';

// ---- NAS 下载管理页：任务列表 / 进度 / 合并 / 重试 / 删除 ----
let _dlmgrTimer=null;
const DL_STATUS={queued:['排队中',''],downloading:['下载中','run'],ready:['待合并','ok'],merging:['合并中','run'],done:['已完成','ok'],failed:['失败','err'],canceled:['已取消','']};
document.getElementById('btn-downloads').onclick=()=>{
  const ov=document.getElementById('dlmgr-overlay');
  const isOpen=ov.classList.contains('open');
  if(isOpen){closeDlmgr();return}
  ov.classList.add('open');
  loadDlmgr();
  _dlmgrTimer=setInterval(loadDlmgr,10000);
};
function closeDlmgr(){
  document.getElementById('dlmgr-overlay').classList.remove('open');
  if(_dlmgrTimer){clearInterval(_dlmgrTimer);_dlmgrTimer=null}
}
document.getElementById('btn-close-dlmgr').onclick=closeDlmgr;
document.getElementById('dlmgr-overlay').addEventListener('click',e=>{if(e.target.id==='dlmgr-overlay')closeDlmgr()});

async function loadDlmgr(){
  const list=document.getElementById('dlmgr-list');
  try{
    const r=await fetch('/api/download/tasks',{headers:AUTH()});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json().catch(()=>({}));
    const tasks=d.tasks||[];
    if(!tasks.length){list.innerHTML='<div class="dlmgr-empty">暂无下载任务<br><span style="font-size:12px">在剧集详情里点"下载到NAS"创建任务</span></div>';return}
    list.innerHTML=tasks.map(t=>{
      const st=DL_STATUS[t.status]||[t.status,''];
      const pct=Math.max(0,Math.min(100,Math.round(t.percent||0)));
      const failed=(t.failedEpisodes||[]).map(f=>f.index).join('、');
      const detail=t.detail||'';
      const canMerge=(t.status==='ready'||t.status==='failed')&&failed&&t.status==='ready'?'（可先合并成功集）':(t.status==='ready'?'（可合并成单文件）':'');
      const canRetry=(t.status==='ready'||t.status==='failed')&&(t.failedEpisodes||[]).length>0;
      const isDone=t.status==='done';
      const srcLabel=t.source==='hongguo'?'红果':'黄果';
      const time=new Date(t.createdAt).toLocaleString();
      return '<div class="dlmgr-item">'+
        '<div class="dlmgr-top"><span class="dlmgr-title">'+escapeHtml(t.title)+'</span>'+
        '<span class="dlmgr-badge '+st[1]+'">'+st[0]+'</span></div>'+
        '<div class="dlmgr-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="dlmgr-detail">'+escapeHtml(detail)+'<br>'+t.doneCount+'/'+t.totalCount+' 集 · '+srcLabel+' · '+time+
        (failed?' · 失败集: '+escapeHtml(failed):'')+(isDone&&t.output?'<br><span class="dlmgr-output">合并文件: '+escapeHtml(String(t.output).split('/').pop())+'</span>':'')+'</div>'+
        '<div class="dlmgr-ops">'+
        (canMerge&&!isDone?'<button class="ghost" data-op="merge" data-id="'+t.id+'">合并</button>':'')+
        (canRetry?'<button class="ghost" data-op="retry" data-id="'+t.id+'">重试失败集</button>':'')+
        '<button class="ghost" data-op="del" data-id="'+t.id+'">删除</button></div>'+
        '</div>';
    }).join('');
    list.querySelectorAll('[data-op]').forEach(btn=>{
      btn.onclick=async()=>{
        const op=btn.dataset.op,id=btn.dataset.id;
        if(op==='del'&&!confirm('删除任务「'+titleOf(id)+'」？将同时删除已下载的分集文件和合并文件')){return}
        btn.disabled=true;
        try{
          const isDel=op==='del';
          const r=await fetch(isDel?('/api/download/tasks/'+id):('/api/download/'+(op==='merge'?'merge':'retry-failed')),{
            method:isDel?'DELETE':'POST',
            headers:Object.assign({'Content-Type':'application/json'},AUTH()),
            body:isDel?undefined:JSON.stringify({id})});
          const d=await r.json().catch(()=>({}));
          if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
          toast(op==='del'?'任务已删除':(op==='merge'?'已开始合并':'已开始重试失败集'));
          loadDlmgr();
        }catch(e){toast((op==='del'?'删除失败':'操作失败')+': '+e.message);btn.disabled=false}
      };
    });
  }catch(e){
    if(String(e.message).includes('401'))list.innerHTML='<div class="dlmgr-empty">管理员未登录或会话已过期，请先在上方 ⚙ 里登录</div>';
    else list.innerHTML='<div class="dlmgr-empty">加载失败: '+e.message+'</div>';
  }
}
function titleOf(id){
  const el=document.querySelector('#dlmgr-list [data-op="del"][data-id="'+id+'"]');
  const item=el&&el.closest('.dlmgr-item');
  const t=item&&item.querySelector('.dlmgr-title');
  return t?t.textContent:id;
}

// ---- 私密源诊断面板 ----
let _lastPrivatePlayUrl=''; // 最近一次私密播放地址（原始源 URL）
document.getElementById('btn-admin-diagnose').onclick=async()=>{
  document.getElementById('diag-overlay').classList.add('open');
  const body=document.getElementById('diag-body');
  body.textContent='诊断中…\n';
  const lines=['== Veyra 私密源诊断 ==','私密站点: '+HUANGGUO_BASE,'转发通道: '+(privateChannel==='relay'?'后端转发':'直连')+'\n'];
  const debug=(label,url)=>fetch('/api/debug/proxy?url='+encodeURIComponent(url),{headers:AUTH()}).then(r=>r.json()).then(d=>{
    lines.push('['+label+']');
    lines.push('  URL: '+String(d.target||url).slice(0,140));
    if(d.attempted&&d.attempted.length>1)lines.push('  尝试序列: '+d.attempted.map(s=>s.slice(0,70)).join(' → '));
    lines.push('  判定: '+(d.verdict||'?')+' → '+(d.ok?'OK':'失败'));
    if(d.status)lines.push('  上游HTTP: '+d.status+' 类型: '+(d.contentType||'').slice(0,40)+' 大小: '+d.bytes+'B');
    if(d.error)lines.push('  错误: '+d.error);
    if(d.cors&&(d.cors['access-control-allow-origin']||d.cors['access-control-allow-headers']))lines.push('  CORS: allow-origin='+(d.cors['access-control-allow-origin']||'-')+' allow-headers='+(d.cors['access-control-allow-headers']||'-'));
    lines.push('');
  }).catch(e=>lines.push('['+label+'] 诊断失败: '+e.message+'\n'));
  // 1) 首页代理
  try{
    const r=await fetch(hgProxy(HUANGGUO_BASE));
    const html=await r.text();
    lines.push('[私密首页] HTTP '+r.status+' 字节 '+(html.length||0));
    const items=parseHuangguoHtml(html);
    lines.push('  解析条目: '+items.length+'（有封面 '+items.filter(i=>i.cover).length+'/'+items.length+'）');
    const cover=items[0]&&items[0].cover;
    if(cover)lines.push('  示例封面: '+cover.slice(0,140));
    else lines.push('  !! 未解析到封面 URL（解析层问题）');
    if(items[0]&&items[0].coverFrom)lines.push('  封面来源片段: '+items[0].coverFrom);
    lines.push('');
    if(cover)await debug('封面',cover);
  }catch(e){lines.push('[私密首页] 失败: '+e.message+'\n')}
  // 1.5) 封面 HTML 特征（定位源站封面真实结构）
  try{
    const site=await fetch('/api/debug/site?url='+encodeURIComponent(HUANGGUO_BASE),{headers:AUTH()}).then(r=>r.json());
    if(site.ok){
      lines.push('[封面HTML特征] 页面 '+site.bytes+'B');
      lines.push(' img标签('+(site.imgs||[]).length+'):');
      (site.imgs||[]).slice(0,5).forEach(s=>lines.push('  '+s));
      lines.push(' 背景style('+(site.backgrounds||[]).length+'):');
      (site.backgrounds||[]).slice(0,3).forEach(s=>lines.push('  '+s));
      lines.push(' 图片属性URL('+(site.attrUrls||[]).length+'):');
      (site.attrUrls||[]).slice(0,6).forEach(s=>lines.push('  '+s));
      lines.push(' 解密脚本线索('+(site.decryptHints||[]).length+'):');
      (site.decryptHints||[]).slice(0,4).forEach(s=>lines.push('  '+s));
      lines.push(' 外部JS('+(site.scriptSrcs||[]).length+'):');
      (site.scriptSrcs||[]).slice(0,6).forEach(s=>lines.push('  '+s));
      lines.push(' 条目HTML('+(site.entries||[]).length+'):');
      (site.entries||[]).forEach(s=>lines.push('  '+s));
      lines.push('');
    }else lines.push('[封面HTML特征] '+site.error+'\n');
  }catch(e){}
  // 2) 最近播放源
  if(_lastPrivatePlayUrl){
    await debug('最近播放源',_lastPrivatePlayUrl);
    try{
      const m=await fetch(hgProxy(_lastPrivatePlayUrl)).then(r=>r.text());
      lines.push('[播放源master] 文本 '+m.length+'B');
      const first=(m.split('\n').map(s=>s.trim()).filter(s=>s&&!s.startsWith('#'))||[])[0];
      if(first){
        lines.push('  首个媒体URI: '+first.slice(0,140));
        const abs=new URL(first,_lastPrivatePlayUrl).toString();
        await debug(/\.m3u8/i.test(abs)?'子m3u8':'首分片',abs);
      }else lines.push('  !! master 内无媒体行');
      lines.push('');
    }catch(e){lines.push('[播放源master] 读取失败: '+e.message+'\n')}
  }else{
    lines.push('[最近播放源] 暂无（去私密模式点一集播放后再诊断）\n');
  }
  body.textContent=lines.join('\n');
};

async function loadUsers(){

    const d=await fetch('/api/admin/users',{headers:AUTH()}).then(r=>r.json());
    document.getElementById('user-rows').innerHTML=(d.users||[]).map(u=>
      '<tr><td>'+escapeHtml(u.username)+'</td><td>'+(u.role==='admin'?'管理员':'用户')+'</td>'+

async function delUser(id){

}
